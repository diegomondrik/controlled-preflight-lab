name: protected-decision-recorder

on:
  workflow_run:
    workflows: [candidate-runtime]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  protected-recorder:
    name: protected-recorder
    if: >-
      github.event.workflow_run.head_repository.full_name ==
      'controlled-preflight-bot/controlled-preflight-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_URL: ${{ github.api_url }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_ID: ${{ github.repository_id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CANDIDATE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RECORDER_RUN_ID: ${{ github.run_id }}
      RECORDER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROVIDER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bind protected metadata and emit the exact decision check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          API = os.environ["API_URL"].rstrip("/")
          REPO = os.environ["REPOSITORY"]
          TOKEN = os.environ["PROVIDER_TOKEN"]
          CANDIDATE = os.environ["CANDIDATE_SHA"]
          EXPECTED_SOURCE = "controlled-preflight-bot/controlled-preflight-lab"
          EXPECTED_CHECK_APP_ID = 15368
          EXPECTED_CHECK_APP_SLUG = "github-actions"

          def api(method, path, payload=None, allow_error=False):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + TOKEN,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "controlled-preflight-recorder",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  parsed = None
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"message": raw.decode("utf-8", "replace")[:1000]}
                  if allow_error:
                      return error.code, parsed
                  raise RuntimeError(f"API {method} {path} returned {error.code}: {parsed}") from error

          def create_check(name, sha, conclusion, summary, external_id):
              return api(
                  "POST",
                  f"/repos/{REPO}/check-runs",
                  {
                      "name": name,
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": conclusion,
                      "external_id": external_id,
                      "details_url": f"https://github.com/{REPO}/actions/runs/{os.environ['RECORDER_RUN_ID']}",
                      "output": {
                          "title": f"Protected decision {conclusion}",
                          "summary": json.dumps(summary, sort_keys=True, separators=(",", ":")),
                      },
                  },
                  allow_error=True,
              )

          def parse_governance_record(item, candidate, source_ref, repository_id):
              if not isinstance(item, dict):
                  raise ValueError("governance-record is not an object")
              check_id = item.get("id")
              if not isinstance(check_id, int) or check_id <= 0:
                  raise ValueError("governance-record check ID invalid")
              exact = {
                  "name": "governance-record",
                  "status": "completed",
                  "conclusion": "success",
                  "head_sha": candidate,
              }
              for key, expected in exact.items():
                  if item.get(key) != expected:
                      raise ValueError(f"governance-record binding mismatch: {key}")
              app = item.get("app") or {}
              if app.get("id") != EXPECTED_CHECK_APP_ID or app.get("slug") != EXPECTED_CHECK_APP_SLUG:
                  raise ValueError("governance-record app identity mismatch")
              output = item.get("output") or {}
              if output.get("title") != "Protected governance success":
                  raise ValueError("governance-record output title mismatch")
              summary = output.get("summary")
              if not isinstance(summary, str):
                  raise ValueError("governance-record summary missing")
              try:
                  governance = json.loads(summary)
              except json.JSONDecodeError as exc:
                  raise ValueError("governance-record summary is not valid JSON") from exc
              if not isinstance(governance, dict):
                  raise ValueError("governance-record summary is not an object")
              exact_bindings = {
                  "schema_version": "1.0",
                  "candidate_sha": candidate,
                  "source_repository": EXPECTED_SOURCE,
                  "source_ref": source_ref,
                  "validation": "passed",
                  "errors": [],
                  "governance_repository_id": repository_id,
              }
              for key, expected in exact_bindings.items():
                  if governance.get(key) != expected:
                      raise ValueError(f"governance-record binding mismatch: {key}")
              run_id = governance.get("governance_run_id")
              run_attempt = governance.get("governance_run_attempt")
              if not isinstance(run_id, int) or run_id <= 0:
                  raise ValueError("governance-record run ID invalid")
              if not isinstance(run_attempt, int) or run_attempt <= 0:
                  raise ValueError("governance-record run attempt invalid")
              expected_external_id = f"governance:{run_id}:{run_attempt}"
              if item.get("external_id") != expected_external_id:
                  raise ValueError("governance-record external ID mismatch")
              base_sha = governance.get("base_sha")
              if not isinstance(base_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", base_sha):
                  raise ValueError("governance-record base SHA invalid")
              manifest_digest = governance.get("protected_manifest_sha256")
              if not isinstance(manifest_digest, str) or not re.fullmatch(r"[0-9a-f]{64}", manifest_digest):
                  raise ValueError("governance-record manifest digest invalid")
              suite_id = (item.get("check_suite") or {}).get("id")
              if not isinstance(suite_id, int) or suite_id <= 0:
                  raise ValueError("governance-record candidate check-suite ID invalid")
              projection = {
                  "name": item.get("name"),
                  "head_sha": item.get("head_sha"),
                  "external_id": item.get("external_id"),
                  "status": item.get("status"),
                  "conclusion": item.get("conclusion"),
                  "app_id": app.get("id"),
                  "app_slug": app.get("slug"),
                  "output_title": output.get("title"),
                  "output_summary": summary,
                  "check_suite_id": suite_id,
              }
              return {"id": check_id, "item": item, "governance": governance, "projection": projection}

          def select_governance_record(matches, candidate, source_ref, repository_id):
              if not matches:
                  raise ValueError("candidate does not have a governance-record")
              parsed = [
                  parse_governance_record(item, candidate, source_ref, repository_id)
                  for item in matches
              ]
              ids = [record["id"] for record in parsed]
              if len(ids) != len(set(ids)):
                  raise ValueError("governance-record check IDs are not unique")
              projection = parsed[0]["projection"]
              if any(record["projection"] != projection for record in parsed[1:]):
                  raise ValueError("governance-record duplicates are not exact protected equivalents")
              selected = min(parsed, key=lambda record: record["id"])
              return selected["item"], selected["governance"], sorted(ids)

          def classify_base_control(source_ref, base_sha, http_status):
              required = source_ref == "preflight/pf-07-attribution"
              if not required:
                  return {"required": False, "attempted": False, "http_status": None, "classification": "not-applicable"}
              if not base_sha:
                  return {"required": True, "attempted": False, "http_status": None, "classification": "not-attempted-missing-bound-base"}
              if http_status == 201:
                  return {"required": True, "attempted": True, "http_status": 201, "classification": "created"}
              return {"required": True, "attempted": True, "http_status": http_status, "classification": "creation-failed"}

          errors = []
          governance = None
          governance_check = None
          governance_equivalent_check_ids = []
          governance_check_suite_id = None
          base_sha = None
          manifest_digest = None
          pull = None
          governance_run_api_head_sha = None
          governance_check_details_url_observed = None

          if not re.fullmatch(r"[0-9a-f]{40}", CANDIDATE):
              errors.append("candidate SHA is not an exact 40-character lowercase commit identity")
          if REPO != "diegomondrik/controlled-preflight-lab":
              errors.append("upstream repository identity mismatch")
          if os.environ["SOURCE_REPOSITORY"] != EXPECTED_SOURCE:
              errors.append("candidate repository identity mismatch")
          if os.environ["CANDIDATE_CONCLUSION"] != "success":
              errors.append("candidate runtime conclusion is not success")

          try:
              _, runtime = api("GET", f"/repos/{REPO}/actions/runs/{os.environ['CANDIDATE_RUN_ID']}")
              if runtime.get("id") != int(os.environ["CANDIDATE_RUN_ID"]):
                  errors.append("candidate run ID mismatch")
              if runtime.get("run_attempt") != int(os.environ["CANDIDATE_RUN_ATTEMPT"]):
                  errors.append("candidate run attempt mismatch")
              if runtime.get("name") != "candidate-runtime":
                  errors.append("candidate workflow name mismatch")
              runtime_path = (runtime.get("path") or "").split("@", 1)[0]
              if runtime_path != ".github/workflows/candidate-runtime.yml":
                  errors.append("candidate workflow path mismatch")
              if runtime.get("event") != "pull_request":
                  errors.append("candidate event mismatch")
              if runtime.get("head_sha") != CANDIDATE:
                  errors.append("candidate run SHA mismatch")
              if runtime.get("head_repository", {}).get("full_name") != EXPECTED_SOURCE:
                  errors.append("candidate run source mismatch")
          except Exception as exc:
              errors.append(str(exc))

          try:
              owner = EXPECTED_SOURCE.split("/", 1)[0]
              head_query = urllib.parse.quote(f"{owner}:{os.environ['SOURCE_REF']}", safe="")
              _, pulls = api("GET", f"/repos/{REPO}/pulls?state=open&head={head_query}&per_page=10")
              exact_pulls = [
                  item for item in pulls
                  if item.get("head", {}).get("repo", {}).get("full_name") == EXPECTED_SOURCE
                  and item.get("head", {}).get("ref") == os.environ["SOURCE_REF"]
              ]
              if len(exact_pulls) != 1:
                  errors.append("no unique live pull request for the candidate source")
              elif exact_pulls[0].get("head", {}).get("sha") != CANDIDATE:
                  errors.append("live pull-request head does not match the completed run")
              else:
                  pull = exact_pulls[0]
          except Exception as exc:
              errors.append(str(exc))

          try:
              query = urllib.parse.urlencode({"check_name": "governance-record", "filter": "all", "per_page": 100})
              _, checks = api("GET", f"/repos/{REPO}/commits/{CANDIDATE}/check-runs?{query}")
              matches = [item for item in checks.get("check_runs", []) if item.get("name") == "governance-record"]
              governance_check, governance, governance_equivalent_check_ids = select_governance_record(
                  matches,
                  CANDIDATE,
                  os.environ["SOURCE_REF"],
                  int(os.environ["REPOSITORY_ID"]),
              )
              governance_check_details_url_observed = governance_check.get("details_url")
              governance_check_suite_id = governance_check.get("check_suite", {}).get("id")
              base_sha = governance.get("base_sha")
              manifest_digest = governance.get("protected_manifest_sha256")

              _, suite = api("GET", f"/repos/{REPO}/check-suites/{governance_check_suite_id}")
              if suite.get("id") != governance_check_suite_id:
                  errors.append("candidate check-suite ID mismatch")
              if suite.get("head_sha") != CANDIDATE:
                  errors.append("candidate check-suite head SHA mismatch")
              suite_app = suite.get("app") or {}
              if suite_app.get("id") != EXPECTED_CHECK_APP_ID or suite_app.get("slug") != EXPECTED_CHECK_APP_SLUG:
                  errors.append("candidate check-suite app identity mismatch")
          except Exception as exc:
              errors.append(str(exc))

          if governance and base_sha:
              try:
                  governance_run_id = governance.get("governance_run_id")
                  _, run = api("GET", f"/repos/{REPO}/actions/runs/{governance_run_id}")
                  if run.get("id") != governance_run_id:
                      errors.append("governance run ID mismatch")
                  if run.get("run_attempt") != governance.get("governance_run_attempt"):
                      errors.append("governance run attempt mismatch")
                  if run.get("event") != "pull_request_target":
                      errors.append("governance event mismatch")
                  if run.get("name") != "governance":
                      errors.append("governance workflow name mismatch")
                  governance_path = (run.get("path") or "").split("@", 1)[0]
                  if governance_path != ".github/workflows/governance.yml":
                      errors.append("governance workflow path mismatch")
                  governance_run_api_head_sha = run.get("head_sha")
                  if governance_run_api_head_sha != CANDIDATE:
                      errors.append("governance run candidate association mismatch")
                  if run.get("head_branch") != os.environ["SOURCE_REF"]:
                      errors.append("governance run source-ref association mismatch")
                  if (run.get("head_repository") or {}).get("full_name") != EXPECTED_SOURCE:
                      errors.append("governance run source-repository association mismatch")
                  if (run.get("repository") or {}).get("id") != int(os.environ["REPOSITORY_ID"]):
                      errors.append("governance repository ID mismatch")

                  if pull is None:
                      errors.append("live pull-request base binding unavailable")
                  else:
                      if (pull.get("base", {}).get("repo") or {}).get("full_name") != REPO:
                          errors.append("live pull-request base repository mismatch")
                      if pull.get("base", {}).get("ref") != "main":
                          errors.append("live pull-request base ref mismatch")
                      if pull.get("base", {}).get("sha") != base_sha:
                          errors.append("live pull-request base SHA mismatch")

                  quoted_ref = urllib.parse.quote(base_sha, safe="")
                  _, item = api("GET", f"/repos/{REPO}/contents/preflight/protected-manifest.json?ref={quoted_ref}")
                  protected_bytes = base64.b64decode(item["content"], validate=False)
                  if hashlib.sha256(protected_bytes).hexdigest() != manifest_digest:
                      errors.append("protected manifest digest does not match the bound base content")
                  protected_manifest = json.loads(protected_bytes)
                  checks_app = (protected_manifest.get("laboratory") or {}).get("checks_app") or {}
                  if checks_app.get("id") != EXPECTED_CHECK_APP_ID or checks_app.get("slug") != EXPECTED_CHECK_APP_SLUG:
                      errors.append("protected manifest check-app binding mismatch")
              except Exception as exc:
                  errors.append(str(exc))

          base_control_status = None
          if os.environ["SOURCE_REF"] == "preflight/pf-07-attribution" and base_sha:
              base_control_status, response = create_check(
                  "protected-decision-control",
                  base_sha,
                  "success",
                  {"schema_version": "1.0", "control": "base-sha-attribution", "candidate_sha": CANDIDATE},
                  f"control:{os.environ['RECORDER_RUN_ID']}:{os.environ['RECORDER_RUN_ATTEMPT']}",
              )
              if base_control_status != 201:
                  errors.append(f"base-SHA control check creation returned HTTP {base_control_status}: {response}")
          base_control = classify_base_control(os.environ["SOURCE_REF"], base_sha, base_control_status)

          decision = {
              "schema_version": "1.0",
              "candidate_sha": CANDIDATE,
              "base_sha": base_sha,
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_ref": os.environ["SOURCE_REF"],
              "candidate_run_id": int(os.environ["CANDIDATE_RUN_ID"]),
              "candidate_run_attempt": int(os.environ["CANDIDATE_RUN_ATTEMPT"]),
              "recorder_run_id": int(os.environ["RECORDER_RUN_ID"]),
              "recorder_run_attempt": int(os.environ["RECORDER_RUN_ATTEMPT"]),
              "protected_manifest_sha256": manifest_digest,
              "governance_run_api_head_sha_observed": governance_run_api_head_sha,
              "governance_check_id_selected": governance_check.get("id") if governance_check else None,
              "governance_check_external_id": governance_check.get("external_id") if governance_check else None,
              "governance_check_suite_id": governance_check_suite_id,
              "governance_equivalent_check_ids": governance_equivalent_check_ids,
              "governance_equivalent_check_count": len(governance_equivalent_check_ids),
              "governance_check_details_url_observed": governance_check_details_url_observed,
              "base_sha_control": base_control,
              "validation": "failed" if errors else "passed",
              "errors": errors,
          }

          conclusion = "failure" if errors else "success"
          status, response = create_check(
              "protected-decision",
              CANDIDATE,
              conclusion,
              decision,
              f"decision:{os.environ['RECORDER_RUN_ID']}:{os.environ['RECORDER_RUN_ATTEMPT']}",
          )
          if status != 201:
              print(json.dumps({
                  "classification": "protected_decision_attribution_failure",
                  "http_status": status,
                  "response": response,
                  "decision": decision,
              }, indent=2, sort_keys=True))
              sys.exit(1)

          print(json.dumps(decision, indent=2, sort_keys=True))
          if errors:
              sys.exit(1)
          PY
