name: candidate-runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  skipped-candidate-runtime:
    name: isolated-candidate-runtime
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: This step must remain skipped
        shell: bash
        run: |
          printf '%s\n' 'unexpected candidate execution'
          exit 1
