name: candidate-runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  isolated-candidate-runtime:
    name: isolated-candidate-runtime
    if: >-
      github.event.pull_request.head.repo.full_name ==
      'controlled-preflight-bot/controlled-preflight-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_REPOSITORY: controlled-preflight-bot/controlled-preflight-lab
      EXPECTED_UPSTREAM_REPOSITORY: diegomondrik/controlled-preflight-lab
      PREFLIGHT_CASE: PF-07
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_REF: ${{ github.event.pull_request.head.ref }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = "$EXPECTED_UPSTREAM_REPOSITORY"
          test "$CANDIDATE_REPOSITORY" = "$EXPECTED_HEAD_REPOSITORY"
          test "$CANDIDATE_SHA" != "$GITHUB_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Emit synthetic attribution marker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema_version":"1.0","case_id":"PF-07","classification":"unverified","detail":"candidate-attribution-marker"}'

      - name: Fetch the exact public candidate without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          git -C candidate init --quiet
          git -C candidate remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C candidate fetch --quiet --depth=1 origin "refs/heads/${CANDIDATE_REF}"
          test "$(git -C candidate rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git -C candidate checkout --quiet --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Run candidate-controlled source in the hardened container
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -i PATH=/usr/bin:/bin timeout --foreground --kill-after=5s 120s \
            docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --user 65532:65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            --tmpfs /work:rw,nosuid,nodev,size=268435456 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=67108864 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/candidate,dst=/src,readonly" \
            --workdir /src \
            golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651 \
            /usr/bin/env -i PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin \
            /bin/sh /src/preflight/scripts/candidate-wrapper.sh
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            124) printf '%s\n' '{"schema_version":"1.0","classification":"timeout","detail":"container_timeout"}' ;;
            125|126|127) printf '%s\n' '{"schema_version":"1.0","classification":"isolation_failure","detail":"container_launch_failed"}' ;;
            137) printf '%s\n' '{"schema_version":"1.0","classification":"isolation_failure","detail":"container_killed"}' ;;
          esac
          exit 1
